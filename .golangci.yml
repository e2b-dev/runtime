version: "2"

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/e2b-dev/infra)

linters:
  default: all
  disable:
    # todo: determine if we want this
    - canonicalheader
    - cyclop
    - dupl
    - dupword
    - errcheck
    - exhaustive
    - exhaustruct
    - exhaustruct_v5
    - funcorder
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocyclo
    - godot
    - godox
    - gomoddirectives
    - gomodguard
    - gosec
    - ireturn
    - lll
    - maintidx
    - mnd
    - nestif
    - nilnil
    - noinlineerr
    - nonamedreturns
    - nosprintfhostport
    - prealloc
    - predeclared
    - tagliatelle
    - testpackage
    - varnamelen
    - wrapcheck

    # todo: enable these
    - err113
    - forcetypeassert
    - godoclint

    # deprecated, remove when golangci-lint makes us
    - wsl
    - wsl_v5

  exclusions:
    rules:
      - path: '^packages/shared/pkg/postgres/dberrors/dberrors\.go$'
        linters:
          - forbidigo
      - path: '.*_test\.go$'
        text: "Use github.com/e2b-dev/infra/packages/shared/pkg/postgres/dberrors.IsNotFoundError instead."
        linters:
          - forbidigo
      # Pre-existing packages with non-recommended names ("types", "utils").
      # excluded for now.
      - path: ".*"
        text: "package-naming"
        linters:
          - revive

  settings:
    usetesting:
      # t.Context() is cancelled just before the test's Cleanup functions run,
      # so teardown that must outlive the test takes
      # context.WithoutCancel(t.Context()) — it keeps the test's values and
      # drops only the cancellation.
      context-background: true
      context-todo: true
    forbidigo:
      forbid:
        - pattern: '.*\.ErrNoRows$'
          pkg: "^database/sql$"
          msg: "Use github.com/e2b-dev/infra/packages/shared/pkg/postgres/dberrors.IsNotFoundError instead."
        - pattern: '.*\.ErrNoRows$'
          pkg: '^github\.com/jackc/pgx/v5$'
          msg: "Use github.com/e2b-dev/infra/packages/shared/pkg/postgres/dberrors.IsNotFoundError instead."
        #        - pattern: os\.Getenv
        #          msg: "Add your field to the configuration model instead."
        - pattern: 'zap\.New$'
          pkg: '^go\.uber\.org/zap$'
          msg: "Use github.com/e2b-dev/infra/packages/shared/pkg/logger instead of zap.New()"
        - pattern: 'zap\.NewProduction$'
          pkg: '^go\.uber\.org/zap$'
          msg: "Use github.com/e2b-dev/infra/packages/shared/pkg/logger instead of zap.NewProduction()"
        - pattern: 'zap\.NewDevelopment$'
          pkg: '^go\.uber\.org/zap$'
          msg: "Use github.com/e2b-dev/infra/packages/shared/pkg/logger instead of zap.NewDevelopment()"
        - pattern: 'zap\.NewExample$'
          pkg: '^go\.uber\.org/zap$'
          msg: "Use github.com/e2b-dev/infra/packages/shared/pkg/logger instead of zap.NewExample()"
        - pattern: 'zap\.L$'
          msg: "Use github.com/e2b-dev/infra/packages/shared/pkg/logger.L() instead of zap.L()"
        - pattern: 'zap\.S$'
          pkg: '^go\.uber\.org/zap$'
          msg: "Use github.com/e2b-dev/infra/packages/shared/pkg/logger instead of zap.S()"
        - pattern: 'zap\.NewNop$'
          pkg: '^go\.uber\.org/zap$'
          msg: "Use github.com/e2b-dev/infra/packages/shared/pkg/logger.NewNopLogger() instead of zap.NewNop()"
        - pattern: 'zap\.Time$'
          pkg: '^go\.uber\.org/zap$'
          msg: "Use github.com/e2b-dev/infra/packages/shared/pkg/logger.Time() instead of zap.Time()"

        # prefer methods that take a context to those that don't
        - pattern: '^retryablehttp\.NewRequest$'
          pkg: ^github\.com/hashicorp/go-retryablehttp$
          msg: "Use github.com/hashicorp/go-retryablehttp.NewRequestWithContext instead of retryablehttp.NewRequest"
        - pattern: 'gin\.SetMode'
          pkg: '^github\.com/gin-gonic/gin$'
          msg: "Do not use gin.SetMode(gin.TestMode) - it causes race conditions. GIN_MODE=test is set in CI workflows."
        - pattern: '^testing\.(T|B|TB|F)\.(Fatal|Fatalf|Fatalln|Error|Errorf|Fail|FailNow)$'
          pkg: '^testing$'
          msg: "Use testify: require.* to stop the test, assert.* to continue."
        - pattern: '^(require|assert)\.(Assertions\.)?FailNowf?$'
          pkg: '^github\.com/stretchr/testify/(require|assert)$'
          msg: "Use require.Fail or require.Failf; they already stop the test."
      analyze-types: true

    depguard:
      rules:
        no-pprof-default-mux:
          files:
            - $all
            - "!**/packages/shared/pkg/telemetry/**"
          deny:
            - pkg: "net/http/pprof"
              desc: "Importing net/http/pprof registers on DefaultServeMux via init(). Use telemetry.NewPprofMux() instead."

    nolintlint:
      # We are temporarily allowing unused nolints due to apparently
      # false failures in CI. See
      # https://github.com/golangci/golangci-lint/issues/3228
      allow-unused: true

    perfsprint:
      # Scoped to `errorf` only: enforce `errors.New` over `fmt.Errorf("static")`.
      # Other perfsprint checks are intentionally disabled to keep this rule surgical.
      # Can be broadened later in a follow-up.
      error-format: true
      errorf: true
      err-error: false
      integer-format: false
      int-conversion: false
      string-format: false
      sprintf1: false
      strconcat: false
      bool-format: false
      hex-format: false
      concat-loop: false

    gocritic:
      disabled-checks:
        - appendAssign
    modernize:
      disable:
        # Literals keep naming the embedded struct (ObjectMeta: metav1.ObjectMeta{...}):
        # the promoted-field keys Go 1.27 allows hide which struct a field belongs to.
        - embedlit
    revive:
      enable-all-rules: true
      rules:
        - { disabled: true, name: add-constant } # todo: enable this
        - { disabled: true, name: argument-limit }
        - { disabled: true, name: bare-return }
        - { disabled: true, name: bool-literal-in-expr }
        - { disabled: true, name: cognitive-complexity }
        - { disabled: true, name: comment-spacings }
        - { disabled: true, name: confusing-naming }
        - { disabled: true, name: confusing-results }
        - { disabled: true, name: context-as-argument }
        - { disabled: true, name: cyclomatic }
        - { disabled: true, name: deep-exit }
        - { disabled: true, name: enforce-switch-style }
        - { disabled: true, name: exported }
        - { disabled: true, name: flag-parameter } # todo: enable this
        - { disabled: true, name: function-length }
        - { disabled: true, name: function-result-limit }
        - { disabled: true, name: get-return }
        - { disabled: true, name: identical-branches } # todo: enable this
        - { disabled: true, name: identical-switch-branches } # todo: enable this
        - { disabled: true, name: import-alias-naming }
        - { disabled: true, name: import-shadowing }
        - { disabled: true, name: line-length-limit }
        - { disabled: true, name: max-control-nesting }
        - { disabled: true, name: max-public-structs }
        - { disabled: true, name: multiline-if-init }
        - { disabled: true, name: nested-structs }
        - { disabled: true, name: package-comments }
        - { disabled: true, name: package-directory-mismatch }
        - { disabled: true, name: unchecked-type-assertion }
        - { disabled: true, name: unexported-naming }
        - { disabled: true, name: unhandled-error } #  todo: enable this
        - { disabled: true, name: unnecessary-format } # todo: enable this
        - { disabled: true, name: unnecessary-stmt } # todo: enable this
        - { disabled: true, name: unsecure-url-scheme }
        - { disabled: true, name: unused-receiver }
        - { disabled: true, name: use-errors-new } # todo: enable this
        - { disabled: true, name: use-waitgroup-go } # todo: enable this
        - { disabled: true, name: var-declaration }
        - { disabled: true, name: var-naming }
        # Log field and OpenTelemetry attribute keys are lower snake_case, so a
        # key has one name in every service, log query and trace query. Dots
        # stay allowed for namespaced keys such as "sandbox.id". The rule
        # matches calls by their text, so it sees the constructors only under
        # the package names zap and attribute.
        - name: string-format
          arguments:
            - - "zap.Any,zap.Array,zap.Binary,zap.Bool,zap.Boolp,zap.Bools,zap.ByteString,zap.ByteStrings,zap.Complex128,zap.Complex128p,zap.Complex128s,zap.Complex64,zap.Complex64p,zap.Complex64s,zap.Dict,zap.Duration,zap.Durationp,zap.Durations,zap.Errors,zap.Float32,zap.Float32p,zap.Float32s,zap.Float64,zap.Float64p,zap.Float64s,zap.Int,zap.Int16,zap.Int16p,zap.Int16s,zap.Int32,zap.Int32p,zap.Int32s,zap.Int64,zap.Int64p,zap.Int64s,zap.Int8,zap.Int8p,zap.Int8s,zap.Intp,zap.Ints,zap.NamedError,zap.Namespace,zap.Object,zap.ObjectValues,zap.Objects,zap.Reflect,zap.Stack,zap.StackSkip,zap.String,zap.Stringer,zap.Stringers,zap.Stringp,zap.Strings,zap.Time,zap.Timep,zap.Times,zap.Uint,zap.Uint16,zap.Uint16p,zap.Uint16s,zap.Uint32,zap.Uint32p,zap.Uint32s,zap.Uint64,zap.Uint64p,zap.Uint64s,zap.Uint8,zap.Uint8p,zap.Uint8s,zap.Uintp,zap.Uintptr,zap.Uintptrp,zap.Uintptrs,zap.Uints,logger.Time"
              - "/^[a-z0-9_.]+$/"
              - "log field keys must be lower snake_case"
            - - "attribute.Bool,attribute.BoolSlice,attribute.ByteSlice,attribute.Float64,attribute.Float64Slice,attribute.Int,attribute.Int64,attribute.Int64Slice,attribute.IntSlice,attribute.Key,attribute.Map,attribute.Slice,attribute.String,attribute.StringSlice,attribute.Stringer"
              - "/^[a-z0-9_.]+$/"
              - "attribute keys must be lower snake_case"

    staticcheck:
      checks:
        - all
        - -S1002 # Omit comparison with boolean constant
        - -SA1019 # TODO: Remove (Using a deprecated function, variable, constant or field)
        - -ST1000 # Incorrect or missing package comment
        - -ST1020 # The documentation of an exported function should start with the function’s name
        - -ST1021 # The documentation of an exported type should start with type’s name
        - -ST1003 # Poorly chosen identifier
        - -QF1008 # Omit embedded fields from selector expression

run:
  allow-parallel-runners: true

issues:
  max-issues-per-linter: 50
  max-same-issues: 50
