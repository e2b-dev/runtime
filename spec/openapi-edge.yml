openapi: 3.0.0
info:
  version: 0.1.0
  title: E2B Edge API

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  responses:
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "401":
      description: Authentication error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "404":
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "409":
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "500":
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "501":
      description: Not implemented by this deployment
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    ClusterNodeInfo:
      required:
        - nodeID
        - serviceInstanceID
        - serviceVersion
        - serviceVersionCommit
        - serviceStartup
        - serviceStatus
      properties:
        nodeID:
          type: string
          description: Node ID
        serviceInstanceID:
          type: string
          description: Service ID
        serviceVersion:
          type: string
          description: Version of the service
        serviceVersionCommit:
          type: string
          description: Version of the service
        serviceStartup:
          type: string
          format: date-time
          description: Time when the node started
        serviceStatus:
          $ref: "#/components/schemas/ClusterNodeStatus"

    ClusterNodeStatus:
      type: string
      description: |
        State of the cluster node.
      enum:
        - healthy
        - draining
        - unhealthy
        - standby
        - shutting_down
        - not_ready
      x-enum-varnames:
        - Healthy
        - Draining
        - Unhealthy
        - Standby
        - ShuttingDown
        - NotReady

    ClusterOrchestratorRole:
      type: string
      description: Capability of the orchestrator
      enum:
        - orchestrator
        - template-builder

    ClusterServiceDiscovery:
      required:
        - orchestrators
      properties:
        orchestrators:
          type: array
          items:
            $ref: "#/components/schemas/ClusterOrchestratorNode"

    ClusterOrchestratorNode:
      required:
        - nodeID
        - serviceInstanceID
        - serviceVersion
        - serviceVersionCommit
        - serviceStartedAt
        - serviceHost
        - serviceStatus
        - roles

      properties:
        nodeID:
          type: string
          description: Node ID
        serviceInstanceID:
          type: string
          description: Service instance ID
        serviceVersion:
          type: string
          description: Service Version
        serviceVersionCommit:
          type: string
          description: Service Version
        serviceHost:
          type: string
          description: Node private host address and service port
        serviceStartedAt:
          type: string
          format: date-time
          description: Time when the node was registered
        serviceStatus:
          $ref: "#/components/schemas/ClusterNodeStatus"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/ClusterOrchestratorRole"

    Error:
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code
        message:
          type: string
          description: Error

    LogLevel:
      type: string
      description: State of the sandbox
      enum:
        - debug
        - info
        - warn
        - error

    BuildLogEntry:
      required:
        - timestamp
        - message
        - level
        - fields
      properties:
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the log entry
        message:
          type: string
          description: Log message content
        level:
          $ref: "#/components/schemas/LogLevel"
        fields:
          type: object
          additionalProperties:
            type: string
            description: Additional fields for the log entry

    SandboxLog:
      description: Log entry with timestamp and line
      required:
        - timestamp
        - line
      properties:
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the log entry
        line:
          type: string
          description: Log line content

    SandboxLogEntry:
      required:
        - timestamp
        - level
        - message
        - fields
      properties:
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the log entry
        message:
          type: string
          description: Log message content
        level:
          $ref: "#/components/schemas/LogLevel"
        fields:
          type: object
          additionalProperties:
            type: string

    TemplateBuildLogsResponse:
      required:
        - logEntries
      properties:
        logEntries:
          default: []
          description: Build logs structured
          type: array
          items:
            $ref: "#/components/schemas/BuildLogEntry"

    SandboxLogsResponse:
      required:
        - logs
        - logEntries
      properties:
        logs:
          default: []
          description: Sandbox logs
          type: array
          items:
            $ref: "#/components/schemas/SandboxLog"
        logEntries:
          description: Structured logs of the sandbox
          type: array
          items:
            $ref: "#/components/schemas/SandboxLogEntry"

    Timestamp:
      type: string
      format: date-time

    SandboxMetric:
      type: object
      required:
        - timestamp
        - timestamp_unix
        - cpu_used_pct
        - cpu_count
        - mem_total
        - mem_used
        - mem_cache
        - disk_total
        - disk_used
      properties:
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the metric
        timestamp_unix:
          type: integer
          format: int64
          description: Unix timestamp in seconds
        cpu_used_pct:
          type: number
          format: float
          description: CPU usage percentage
        cpu_count:
          type: integer
          format: int32
          description: Number of CPUs
        mem_total:
          type: integer
          format: int64
          description: Total memory in bytes
        mem_used:
          type: integer
          format: int64
          description: Used memory in bytes
        mem_cache:
          type: integer
          format: int64
          description: Cached memory (page cache) in bytes
        disk_total:
          type: integer
          format: int64
          description: Total disk space in bytes
        disk_used:
          type: integer
          format: int64
          description: Used disk space in bytes

    SandboxesWithMetrics:
      type: object
      required:
        - sandboxes
      properties:
        sandboxes:
          type: object
          description: Map of sandbox IDs to their latest metrics
          additionalProperties:
            $ref: "#/components/schemas/SandboxMetric"
    Rig:
      type: object
      description: An orchestrator node pool backed by one cloud scaling group
      required:
        - id
        - provider
        - resourceId
        - capacityDesired
        - capacityCurrent
      properties:
        id:
          type: string
          description: Rig identifier (e.g. "default")
        provider:
          type: string
          description: Cloud provider backing the rig ("aws" or "gcp")
        resourceId:
          type: string
          description: Canonical cloud resource ID of the scaling group backing the rig (ARN on AWS, self-link on GCP)
        capacityDesired:
          type: integer
          format: int32
          description: Desired number of instances in the rig
        capacityMin:
          type: integer
          format: int32
          description: >
            Minimum capacity enforced on the rig's scaling group. Omitted when
            nothing enforces bounds (GCP MIG without an active autoscaler).
        capacityMax:
          type: integer
          format: int32
          description: >
            Maximum capacity enforced on the rig's scaling group. Omitted when
            nothing enforces bounds (GCP MIG without an active autoscaler).
        capacityCurrent:
          type: integer
          format: int32
          description: Number of instances currently attached to the rig

    RigsResponse:
      type: object
      description: >
        Rigs managed by this cluster. Wrapped in an object so the endpoint can
        grow additional fields without breaking clients.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Rig"

    RigCapacityRequest:
      type: object
      description: Desired capacity to set on the rig's scaling group
      required:
        - desired
      properties:
        desired:
          type: integer
          format: int32
          minimum: 0
          description: Absolute desired number of instances in the rig

    RigError:
      type: object
      description: >
        Scaling error on the rig's scaling group, e.g. a failed instance
        creation due to resource exhaustion
      required:
        - timestamp
        - code
        - message
      properties:
        timestamp:
          type: string
          format: date-time
          description: When the error occurred
        code:
          type: string
          description: Provider-specific error code (e.g. ZONE_RESOURCE_POOL_EXHAUSTED, Failed)
        message:
          type: string
          description: Human-readable error message
        instance:
          type: string
          nullable: true
          description: Instance the error relates to, if any
        action:
          type: string
          nullable: true
          description: Action being performed when the error occurred (e.g. CREATING)

    RigInstance:
      type: object
      description: An instance attached to a rig's scaling group
      required:
        - id
        - createdAt
        - transitioning
        - terminating
      properties:
        id:
          type: string
          description: Provider instance ID (EC2 instance ID on AWS, instance name on GCP), also the node ID the orchestrator reports
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: When the provider created the instance. Null while the instance is transitioning.
        transitioning:
          type: boolean
          description: The provider is creating, deleting, recreating or otherwise mutating the instance
        terminating:
          type: boolean
          description: The instance is on its way out of the group and can never become healthy again

    RigInstancesResponse:
      type: object
      description: >
        Instances attached to a rig's scaling group. Wrapped in an object so the
        endpoint can grow additional fields without breaking clients.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RigInstance"

tags:
  - name: service-discovery
  - name: sandboxes
  - name: rigs

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      description: Health check
      responses:
        "200":
          description: Request was successful

  /health/machine:
    get:
      operationId: healthCheckMachine
      summary: Health check machine
      description: Health check for machine status
      responses:
        "200":
          description: Request was successful

  /v1/info:
    get:
      operationId: v1Info
      summary: Edge service information (v1)
      description: Edge service information
      responses:
        "200":
          description: Successfully returned node information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterNodeInfo"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"

  # todo: remove deprecated endpoint when all APIs are redeployed (https://linear.app/e2b/issue/ENG-3464)
  /v1/service-discovery/nodes/orchestrators:
    get:
      operationId: v1ServiceDiscoveryGetOrchestrators
      summary: List orchestrators (v1)
      description: Deprecated way how to get the orchestrators, use v2 endpoint instead.
      deprecated: true
      security:
        - ApiKeyAuth: []
      tags: [service-discovery]
      responses:
        "200":
          description: Successfully returned all orchestrators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClusterOrchestratorNode"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"

  /v1/service-discovery:
    get:
      operationId: v1ServiceDiscovery
      summary: Service discovery information (v1)
      security:
        - ApiKeyAuth: []
      tags: [service-discovery]
      responses:
        "200":
          description: Successfully returned all orchestrators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterServiceDiscovery"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"

  /v1/sandboxes/{sandboxID}/logs:
    get:
      operationId: v1SandboxLogs
      summary: List structured sandbox logs (v1)
      security:
        - ApiKeyAuth: []
      tags: [sandboxes]
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
        - in: query
          name: teamID
          required: true
          schema:
            type: string
        - in: query
          name: start
          schema:
            type: integer
            format: int64
            minimum: 0
          description: Starting timestamp of the logs that should be returned in milliseconds
        - in: query
          name: end
          schema:
            type: integer
            format: int64
            minimum: 0
          description: Ending timestamp of the logs that should be returned in milliseconds
        - in: query
          name: limit
          schema:
            default: 1000
            format: int32
            minimum: 0
            type: integer
          description: Maximum number of logs that should be returned
        - in: query
          name: direction
          schema:
            type: string
            enum:
              - forward
              - backward
          description: Direction of the logs that should be returned. Defaults to forward
        - in: query
          name: level
          schema:
            $ref: "#/components/schemas/LogLevel"
          description: Minimum log level to return. Logs below this level are excluded
        - in: query
          name: search
          schema:
            type: string
            maxLength: 256
          description: Case-sensitive substring match on log message content
      responses:
        "200":
          description: Successfully returned the sandbox logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxLogsResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"

  /v1/sandboxes/{sandboxID}/metrics:
    get:
      operationId: v1SandboxMetrics
      summary: Time-series metrics for a sandbox (v1)
      security:
        - ApiKeyAuth: []
      tags: [sandboxes]
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
          description: Sandbox ID
        - name: teamID
          in: query
          required: true
          schema:
            type: string
          description: Team ID that owns the sandbox
        - name: start
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Start time in Unix seconds
        - name: end
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: End time in Unix seconds
      responses:
        "200":
          description: Successfully returned sandbox metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SandboxMetric"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"

  /v1/sandboxes/metrics:
    get:
      operationId: v1SandboxesMetrics
      summary: Latest metrics for multiple sandboxes (v1)
      security:
        - ApiKeyAuth: []
      tags: [sandboxes]
      parameters:
        - name: teamID
          in: query
          required: true
          schema:
            type: string
          description: Team ID that owns the sandboxes
        - name: sandbox_ids
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
          description: List of sandbox IDs (max 100)
      responses:
        "200":
          description: Successfully returned sandboxes with metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxesWithMetrics"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"

  /v1/templates/builds/{buildID}/logs:
    get:
      operationId: v1TemplateBuildLogs
      summary: Template build logs (v1)
      security:
        - ApiKeyAuth: []
      tags: [templates]
      parameters:
        - name: buildID
          in: path
          required: true
          schema:
            type: string
        - in: query
          name: orchestratorID
          required: false
          deprecated: true
          schema:
            type: string
        - in: query
          name: templateID
          required: true
          schema:
            type: string
        - in: query
          name: offset
          schema:
            default: 0
            type: integer
            format: int32
            minimum: 0
          description: Index of the starting build log that should be returned with the template
        - in: query
          name: start
          schema:
            type: integer
            format: int64
            minimum: 0
          description: Starting timestamp of the logs that should be returned in milliseconds
        - in: query
          name: end
          schema:
            type: integer
            format: int64
            minimum: 0
          description: Ending timestamp of the logs that should be returned in milliseconds
        - in: query
          name: limit
          schema:
            default: 100
            type: integer
            format: int32
            minimum: 0
            maximum: 100
          description: Maximum number of logs that should be returned
        - in: query
          name: direction
          schema:
            type: string
            enum:
              - forward
              - backward
            description: Direction of the logs that should be returned
        - in: query
          name: level
          schema:
            $ref: "#/components/schemas/LogLevel"
      responses:
        "200":
          description: Successfully returned the template build logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateBuildLogsResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"

  /v1/rigs:
    get:
      operationId: v1Rigs
      summary: List rigs (orchestrator node pools)
      description: >
        List the rigs managed by this cluster with a snapshot of their scaling
        groups. Clusters without rig management configured return an empty list.
      security:
        - ApiKeyAuth: []
      tags: [rigs]
      responses:
        "200":
          description: Successfully returned rigs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RigsResponse"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"

  /v1/rigs/{rigID}/capacity:
    put:
      operationId: v1RigsRigIDCapacity
      summary: Set the capacity of a rig
      description: >
        Set the desired instance count on the rig's scaling group. The value is
        passed to the cloud provider unchanged; violations of the group's bounds
        or conflicting concurrent operations surface as errors.
      security:
        - ApiKeyAuth: []
      tags: [rigs]
      parameters:
        - name: rigID
          in: path
          required: true
          schema:
            type: string
          description: Rig identifier (e.g. "default")
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RigCapacityRequest"
      responses:
        "202":
          description: Capacity change accepted
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"
        "501":
          $ref: "#/components/responses/501"

  /v1/rigs/instances/{instanceID}:
    delete:
      operationId: v1RigsInstancesInstanceID
      summary: Terminate an instance in a rig
      description: >
        Terminate a specific instance in whichever rig's scaling group it belongs to.
        The caller chooses whether the rig shrinks or the instance is replaced.
      security:
        - ApiKeyAuth: []
      tags: [rigs]
      parameters:
        - name: instanceID
          in: path
          required: true
          schema:
            type: string
          description: Provider instance ID
        - name: decrementDesired
          in: query
          required: true
          schema:
            type: boolean
          description: >
            When true, desired capacity is decremented (rig shrinks);
            when false, the scaling group launches a replacement instance
      responses:
        "202":
          description: Instance termination accepted
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"
        "501":
          $ref: "#/components/responses/501"

  /v1/rigs/{rigID}/instances:
    get:
      operationId: v1RigsRigIDInstances
      summary: List the instances attached to a rig
      description: >
        List the instances attached to the rig's scaling group with their
        creation time and transition state, sorted by instance ID.
      security:
        - ApiKeyAuth: []
      tags: [rigs]
      parameters:
        - name: rigID
          in: path
          required: true
          schema:
            type: string
          description: Rig identifier (e.g. "default")
      responses:
        "200":
          description: Successfully returned rig instances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RigInstancesResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
        "501":
          $ref: "#/components/responses/501"

  /v1/rigs/{rigID}/errors:
    get:
      operationId: v1RigsRigIDErrors
      summary: List recent scaling errors of a rig
      description: >
        List recent scaling errors on the rig's scaling group (e.g. failed
        instance creations due to resource exhaustion), newest first
      security:
        - ApiKeyAuth: []
      tags: [rigs]
      parameters:
        - name: rigID
          in: path
          required: true
          schema:
            type: string
          description: Rig identifier (e.g. "default")
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
            default: 20
          description: Maximum number of errors to return
      responses:
        "200":
          description: Successfully returned rig errors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RigError"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
        "501":
          $ref: "#/components/responses/501"
