  /v1/management/projects/{projectID}:
    parameters:
      - $ref: "#/components/parameters/projectID"
    put:
      operationId: managementUpsertProject
      summary: Create or reconcile a project (v1).
      tags: [control-plane-management]
      security:
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagementProjectUpsertRequest"
      responses:
        "200":
          description: Existing project reconciled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementProject"
        "201":
          description: Project created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementProject"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"
        "501":
          $ref: "#/components/responses/501"
    delete:
      operationId: managementDeleteProject
      summary: Delete a project and its control-plane state (v1).
      description: >-
        Declared, and answered with 501 by every control plane. Deleting a
        project means reclaiming templates, snapshots, volumes, running
        sandboxes and their stored artifacts, and no single service can reach
        all of them today. Callers should not depend on this operation until
        that changes.
      tags: [control-plane-management]
      security:
        - AdminJWTAuth: []
      responses:
        "204":
          description: Project state is absent.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"
        "501":
          $ref: "#/components/responses/501"

  /v1/management/projects/{projectID}/members/{userID}:
    parameters:
      - $ref: "#/components/parameters/projectID"
      - $ref: "#/components/parameters/userID"
    put:
      operationId: managementApplyProjectMember
      summary: Apply one versioned project member projection (v1).
      description: >-
        Applies the newest desired presence for one project member. An older
        or duplicate revision is accepted without changing target state.
      tags: [control-plane-management]
      security:
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagementProjectMemberApplyRequest"
      responses:
        "204":
          description: Membership projection is applied or already superseded.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"

