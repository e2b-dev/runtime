    parameters:
      - $ref: "#/components/parameters/projectID"
    put:
      operationId: managementUpsertProjectLimits
      summary: Reconcile effective limits for a project (v1).
      tags: [control-plane-management]
      security:
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagementProjectLimits"
      responses:
        "204":
          description: Effective limits are synchronized.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
        "501":
          $ref: "#/components/responses/501"

  /v1/management/projects/{projectID}/block:
    parameters:
      - $ref: "#/components/parameters/projectID"
    put:
      operationId: managementApplyProjectBlock
      summary: Apply a project's block state (v1).
      description: >-
        Records whether the project is refused billable work, which the auth
        path reads before it lets a sandbox start. An older or duplicate
        revision is accepted without changing target state.
      tags: [control-plane-management]
      security:
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagementProjectBlockRequest"
      responses:
        "204":
          description: Block state is applied or already superseded.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
        "501":
          $ref: "#/components/responses/501"

  /v1/management/clusters/{clusterID}:
    parameters:
      - $ref: "#/components/parameters/clusterID"
    put:
      operationId: managementRegisterCluster
      summary: Register a cluster (v1).
      tags: [control-plane-management]
      security:
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagementClusterRegistrationRequest"
      responses:
        "204":
          description: Cluster registration is present.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"
    delete:
      operationId: managementDeleteCluster
      summary: Delete an unreferenced cluster (v1).
      description: Deletes a cluster after all team assignments are detached and no active environment references remain. Releases soft-deleted environment references in the same transaction while preserving environment and build history. Repeating a completed deletion succeeds.
      tags: [control-plane-management]
      security:
        - AdminJWTAuth: []
      responses:
        "204":
          description: Cluster is absent.
        "401":
          $ref: "#/components/responses/401"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"

  /v1/management/projects/{projectID}/cluster/{clusterID}:
    parameters:
      - $ref: "#/components/parameters/projectID"
      - $ref: "#/components/parameters/clusterID"
    put:
      operationId: managementAssignProjectCluster
      summary: Assign a cluster to a project (v1).
      description: >-
        Assigns the cluster only when the project's tier identifier contains `enterprise`,
        case-insensitively. Replaying the identical assignment succeeds even if the project's
        tier later changes.
      tags: [control-plane-management]
      security:
        - AdminJWTAuth: []
      responses:
        "204":
          description: Cluster is assigned to the project.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"
    delete:
      operationId: managementDetachProjectCluster
      summary: Detach a cluster assignment from a project (v1).
      tags: [control-plane-management]
      security:
        - AdminJWTAuth: []
      responses:
        "204":
          description: The matching assignment is absent.
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"
