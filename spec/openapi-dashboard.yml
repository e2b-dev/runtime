openapi: "3.0.0"

info:
  version: 0.1.0
  title: E2B Dashboard API

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    AdminApiKeyAuth:
      type: apiKey
      in: header
      name: X-Admin-Token
    AdminJWTAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    # AuthProviderBearerAuth / AuthProviderTeamAuth: B before T in the name
    # so Bearer is validated before Team.
    AuthProviderBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: access_token
    AuthProviderTeamAuth:
      type: apiKey
      in: header
      name: X-Team-ID

  parameters:
    build_id:
      name: build_id
      in: path
      required: true
      description: Identifier of the build.
      schema:
        type: string
        format: uuid
    sandboxID:
      name: sandboxID
      in: path
      required: true
      description: Identifier of the sandbox.
      schema:
        type: string
    builds_limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
    builds_cursor:
      name: cursor
      in: query
      required: false
      description: Cursor returned by the previous list response in `created_at|build_id` format.
      schema:
        type: string
    build_id_or_template:
      name: build_id_or_template
      in: query
      required: false
      description: Optional filter by build identifier, template identifier, or template alias.
      schema:
        type: string
    build_statuses:
      name: statuses
      in: query
      required: false
      description: Comma-separated list of build statuses to include.
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: "#/components/schemas/BuildStatus"
    build_ids:
      name: build_ids
      in: query
      required: true
      description: Comma-separated list of build IDs to get statuses for.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
        maxItems: 100
        uniqueItems: true
    teamID:
      name: teamID
      in: path
      required: true
      description: Identifier of the team.
      schema:
        type: string
        format: uuid
    clusterID:
      name: clusterID
      in: path
      required: true
      description: Identifier of the cluster.
      schema:
        type: string
        format: uuid
    projectID:
      name: projectID
      in: path
      required: true
      description: Identifier of the project.
      schema:
        type: string
        format: uuid
    userID:
      name: userID
      in: path
      required: true
      description: Identifier of the user.
      schema:
        type: string
        format: uuid
    userId:
      name: userId
      in: path
      required: true
      description: Identifier of the user.
      schema:
        type: string
        format: uuid
    teamSlug:
      name: slug
      in: query
      required: true
      description: Team slug to resolve.
      schema:
        type: string
    templates_limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
    templateID:
      name: templateID
      in: path
      required: true
      description: Identifier of the template.
      schema:
        type: string
    tag:
      name: tag
      in: query
      required: true
      description: Template tag name to check.
      schema:
        type: string
        minLength: 1
    tag_assignment_limit:
      name: assignmentLimit
      in: query
      required: false
      description: Maximum number of ready assignment rows to return per tag.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 25
        default: 6
    tag_path:
      name: tag
      in: path
      required: true
      description: Template tag name.
      schema:
        type: string
        minLength: 1
    tag_assignments_limit:
      name: limit
      in: query
      required: false
      description: Maximum number of assignment rows to return per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
    templates_cursor:
      name: cursor
      in: query
      required: false
      description: Cursor returned by the previous list response in `{sort}|{value}|{templateID}` format. Rejected if its sort does not match the request.
      schema:
        type: string
    templates_public:
      name: public
      in: query
      required: false
      description: Filter templates by visibility (true = public, false = internal).
      schema:
        type: boolean
    templates_search:
      name: search
      in: query
      required: false
      description: Case-insensitive substring match on template names, aliases, and template id.
      schema:
        type: string
    templates_sort:
      name: sort
      in: query
      required: false
      description: Sort column and direction.
      schema:
        type: string
        enum: [created_at_asc, created_at_desc, updated_at_asc, updated_at_desc]
        default: created_at_desc
    tag_assignments_cursor:
      name: cursor
      in: query
      required: false
      description: Cursor returned by the previous list response in `assigned_at|assignment_id` format.
      schema:
        type: string
    tag_groups_limit:
      name: tagsLimit
      in: query
      required: false
      description: Maximum number of distinct tags to return per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 25
    tag_groups_cursor:
      name: tagsCursor
      in: query
      required: false
      description: Cursor returned by the previous list response in `{sort}|{latest_assigned_at}|{tag}` format (sort-tagged, RFC3339Nano).
      schema:
        type: string
    tag_groups_search:
      name: search
      in: query
      required: false
      description: Case-insensitive substring filter on tag name. Allowed characters are `a-z`, `0-9`, `.`, `_`, `-`.
      schema:
        type: string
        maxLength: 64
        pattern: "^[a-z0-9._-]*$"
    tag_groups_sort:
      name: sort
      in: query
      required: false
      description: Sort order for the returned tag groups.
      schema:
        type: string
        enum: [latest_desc, latest_asc, name_asc, name_desc]
        default: latest_desc

  responses:
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "401":
      description: Authentication error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "404":
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "409":
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "412":
      description: Legacy team mutations are disabled
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "500":
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "501":
      description: Operation is not implemented
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "502":
      description: Upstream error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code.
        message:
          type: string
          description: Error message.

    AdminAuthProviderProfile:
      type: object
      required:
        - userId
        - email
      properties:
        userId:
          type: string
          format: uuid
          description: Internal E2B user identifier.
        email:
          type: string
          nullable: true
          description: Email address from the configured auth provider.

    AdminAuthProviderProfilesResponse:
      type: object
      required:
        - profiles
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/AdminAuthProviderProfile"

    AdminAuthProviderProfilesResolveRequest:
      type: object
      required:
        - userIds
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid

    AdminAuthProviderProfilesLookupEmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    AdminAuthProviderUserBootstrapRequest:
      type: object
      required:
        - oidc_issuer
        - oidc_user_id
        - oidc_user_email
      properties:
        oidc_issuer:
          type: string
          minLength: 1
        oidc_user_id:
          type: string
          minLength: 1
        oidc_user_email:
          type: string
          format: email
        oidc_user_name:
          type: string
          nullable: true
        signup_ip:
          type: string
        signup_user_agent:
          type: string

    AdminTeamBootstrapRequest:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          minLength: 1
          description: Team name.
        email:
          type: string
          format: email
          description: Billing/contact email for the team.

    AdminClusterCreateRequest:
      type: object
      required:
        - name
        - endpoint
        - endpoint_tls
        - token
      properties:
        cluster_id:
          type: string
          format: uuid
          description: Optional stable identifier for idempotent creation. Reuse succeeds only when the immutable configuration is identical.
        name:
          type: string
          minLength: 1
        endpoint:
          type: string
          minLength: 1
        endpoint_tls:
          type: boolean
        token:
          type: string
          minLength: 1
        sandbox_proxy_domain:
          type: string
          nullable: true
        auth_org_id:
          type: string
          nullable: true

    AdminClusterCreateResponse:
      type: object
      required:
        - cluster_id
      properties:
        cluster_id:
          type: string
          format: uuid

    AdminTeamBlockRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Shown to the team as the reason it is blocked.

    AdminTeamClusterAssignmentRequest:
      type: object
      required:
        - cluster_id
      properties:
        cluster_id:
          type: string
          format: uuid
        preserve_existing:
          type: boolean
          default: false
          description: Assign only when the team is unassigned or already assigned to cluster_id.

    AdminTeamClusterAssignmentResponse:
      type: object
      required:
        - cluster_id
      properties:
        cluster_id:
          type: string
          format: uuid

    BuildStatus:
      type: string
      description: Build status mapped for dashboard clients.
      enum:
        - building
        - failed
        - success

    ListedBuild:
      type: object
      required:
        - id
        - template
        - templateId
        - status
        - statusMessage
        - createdAt
        - finishedAt
        - cpuCount
        - memoryMB
        - diskSizeMB
        - envdVersion
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the build.
        template:
          type: string
          description: Template alias when present, otherwise template ID.
        templateId:
          type: string
          description: Identifier of the template.
        status:
          $ref: "#/components/schemas/BuildStatus"
        statusMessage:
          type: string
          nullable: true
          description: Failure message when status is `failed`, otherwise `null`.
        createdAt:
          type: string
          format: date-time
          description: Build creation timestamp in RFC3339 format.
        finishedAt:
          type: string
          format: date-time
          nullable: true
          description: Build completion timestamp in RFC3339 format, if finished.
        cpuCount:
          type: integer
          format: int64
          description: CPU cores configured for the build.
        memoryMB:
          type: integer
          format: int64
          description: Memory in MiB configured for the build.
        diskSizeMB:
          type: integer
          format: int64
          nullable: true
          description: Disk size in MiB configured for the build, if recorded.
        envdVersion:
          type: string
          nullable: true
          description: envd version the build was created with, if recorded.

    BuildsListResponse:
      type: object
      required:
        - data
        - nextCursor
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ListedBuild"
        nextCursor:
          type: string
          nullable: true
          description: Cursor to pass to the next list request, or `null` if there is no next page.

    BuildStatusItem:
      type: object
      required:
        - id
        - status
        - finishedAt
        - statusMessage
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the build.
        status:
          $ref: "#/components/schemas/BuildStatus"
        finishedAt:
          type: string
          format: date-time
          nullable: true
          description: Build completion timestamp in RFC3339 format, if finished.
        statusMessage:
          type: string
          nullable: true
          description: Failure message when status is `failed`, otherwise `null`.

    BuildsStatusesResponse:
      type: object
      required:
        - buildStatuses
      properties:
        buildStatuses:
          type: array
          description: List of build statuses
          items:
            $ref: "#/components/schemas/BuildStatusItem"

    BuildInfo:
      type: object
      required:
        - createdAt
        - finishedAt
        - status
        - statusMessage
      properties:
        names:
          type: array
          items:
            type: string
          nullable: true
          description: Template names related to this build, if available.
        createdAt:
          type: string
          format: date-time
          description: Build creation timestamp in RFC3339 format.
        finishedAt:
          type: string
          format: date-time
          nullable: true
          description: Build completion timestamp in RFC3339 format, if finished.
        status:
          $ref: "#/components/schemas/BuildStatus"
        statusMessage:
          type: string
          nullable: true
          description: Failure message when status is `failed`, otherwise `null`.

    CPUCount:
      type: integer
      format: int64
      minimum: 1
      description: CPU cores for the sandbox

    MemoryMB:
      type: integer
      format: int64
      minimum: 128
      description: Memory for the sandbox in MiB

    DiskSizeMB:
      type: integer
      format: int64
      minimum: 0
      description: Disk size for the sandbox in MiB

    SandboxRecord:
      type: object
      required:
        - templateID
        - sandboxID
        - startedAt
        - cpuCount
        - memoryMB
        - diskSizeMB
        - retentionExpired
        - eventsRetentionExpired
      properties:
        templateID:
          type: string
          description: Identifier of the template from which is the sandbox created
        alias:
          type: string
          description: Alias of the template
        sandboxID:
          type: string
          description: Identifier of the sandbox
        startedAt:
          type: string
          format: date-time
          description: Time when the sandbox was started
        stoppedAt:
          type: string
          format: date-time
          nullable: true
          description: Time when the sandbox was stopped
        domain:
          type: string
          nullable: true
          description: Base domain where the sandbox traffic is accessible
        cpuCount:
          $ref: "#/components/schemas/CPUCount"
        memoryMB:
          $ref: "#/components/schemas/MemoryMB"
        diskSizeMB:
          $ref: "#/components/schemas/DiskSizeMB"
        retentionExpired:
          type: boolean
          description: Whether the sandbox ended more than the fixed retention window ago, so its monitoring and logs data is no longer available
        eventsRetentionExpired:
          type: boolean
          description: Whether the sandbox ended more than the team's events retention window ago, so its events data is no longer available

    HealthResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable health check result.

    UserTeamLimits:
      type: object
      required:
        - maxLengthHours
        - concurrentSandboxes
        - concurrentTemplateBuilds
        - maxVcpu
        - maxRamMb
        - diskMb
        - eventsTtlDays
      properties:
        maxLengthHours:
          type: integer
          format: int64
        concurrentSandboxes:
          type: integer
          format: int64
        concurrentTemplateBuilds:
          type: integer
          format: int64
        maxVcpu:
          type: integer
          format: int64
        maxRamMb:
          type: integer
          format: int64
        diskMb:
          type: integer
          format: int64
        eventsTtlDays:
          type: integer
          format: int64

    TeamLimitsResponse:
      type: object
      required:
        - tier
        - limits
      properties:
        tier:
          type: string
          description: The team's raw tier identifier, exactly as stored (not normalized to a catalog plan).
        limits:
          $ref: "#/components/schemas/UserTeamLimits"

    UserTeam:
      type: object
      required:
        - id
        - name
        - slug
        - tier
        - email
        - isBlocked
        - isBanned
        - blockedReason
        - isDefault
        - limits
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        tier:
          type: string
        email:
          type: string
        isBlocked:
          type: boolean
        isBanned:
          type: boolean
        blockedReason:
          type: string
          nullable: true
        isDefault:
          type: boolean
        limits:
          $ref: "#/components/schemas/UserTeamLimits"
        createdAt:
          type: string
          format: date-time

    UserTeamsResponse:
      type: object
      required:
        - teams
      properties:
        teams:
          type: array
          items:
            $ref: "#/components/schemas/UserTeam"

    TeamStatusResponse:
      type: object
      required:
        - isBlocked
        - isBanned
        - blockedReason
      properties:
        isBlocked:
          type: boolean
        isBanned:
          type: boolean
        blockedReason:
          type: string
          nullable: true

    TeamMember:
      type: object
      required:
        - id
        - email
        - isDefault
        - createdAt
        - providers
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
          nullable: true
        profilePictureUrl:
          type: string
          format: uri
          nullable: true
        providers:
          type: array
          items:
            type: string
        isDefault:
          type: boolean
        addedBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true

    TeamMembersResponse:
      type: object
      required:
        - members
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"

    UpdateTeamRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    UpdateTeamResponse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    AddTeamMemberRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    CreateTeamRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    DefaultTemplateAlias:
      type: object
      required:
        - alias
      properties:
        alias:
          type: string
        namespace:
          type: string
          nullable: true

    DefaultTemplate:
      type: object
      required:
        - id
        - aliases
        - buildId
        - ramMb
        - vcpu
        - totalDiskSizeMb
        - createdAt
        - public
        - buildCount
        - spawnCount
      properties:
        id:
          type: string
        aliases:
          type: array
          items:
            $ref: "#/components/schemas/DefaultTemplateAlias"
        buildId:
          type: string
          format: uuid
        ramMb:
          type: integer
          format: int64
        vcpu:
          type: integer
          format: int64
        totalDiskSizeMb:
          type: integer
          format: int64
          nullable: true
        envdVersion:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        public:
          type: boolean
        buildCount:
          type: integer
          format: int32
        spawnCount:
          type: integer
          format: int64

    DefaultTemplatesResponse:
      type: object
      required:
        - templates
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/DefaultTemplate"

    TeamTemplate:
      type: object
      required:
        - templateID
        - buildID
        - cpuCount
        - memoryMB
        - diskSizeMB
        - public
        - aliases
        - names
        - createdAt
        - updatedAt
        - createdBy
        - lastSpawnedAt
        - spawnCount
        - buildCount
        - envdVersion
        - isDefault
      properties:
        templateID:
          type: string
        buildID:
          type: string
          format: uuid
        cpuCount:
          type: integer
          format: int64
        memoryMB:
          type: integer
          format: int64
        diskSizeMB:
          type: integer
          format: int64
          nullable: true
        public:
          type: boolean
        aliases:
          type: array
          items:
            type: string
        names:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          nullable: true
          type: object
          required:
            - id
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              nullable: true
        lastSpawnedAt:
          type: string
          format: date-time
          nullable: true
        spawnCount:
          type: integer
          format: int64
        buildCount:
          type: integer
          format: int32
        envdVersion:
          type: string
          nullable: true
        isDefault:
          type: boolean
        defaultDescription:
          type: string
          nullable: true

    TeamTemplatesResponse:
      type: object
      required:
        - data
        - nextCursor
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TeamTemplate"
        nextCursor:
          type: string
          nullable: true
          description: Cursor to pass to the next list request, or `null` if there is no next page.

    TemplateDetail:
      type: object
      description: Dashboard-shaped single-template read. Mirrors the infra-api `Template` schema fields the dashboard renders.
      required:
        - templateID
        - buildID
        - cpuCount
        - memoryMB
        - diskSizeMB
        - public
        - aliases
        - names
        - createdAt
        - updatedAt
        - lastSpawnedAt
        - spawnCount
        - buildCount
        - envdVersion
      properties:
        templateID:
          type: string
          description: Identifier of the template.
        buildID:
          type: string
          description: Identifier of the latest ready build for the template, or the zero UUID when none.
        cpuCount:
          allOf:
            - $ref: "#/components/schemas/CPUCount"
          nullable: true
          description: vCPU count of the latest ready default build, or `null` when none.
        memoryMB:
          allOf:
            - $ref: "#/components/schemas/MemoryMB"
          nullable: true
          description: Memory in MiB of the latest ready default build, or `null` when none.
        diskSizeMB:
          allOf:
            - $ref: "#/components/schemas/DiskSizeMB"
          nullable: true
          description: Disk size in MiB of the latest ready default build, or `null` when none.
        public:
          type: boolean
          description: Whether the template is public or only accessible by the team.
        aliases:
          type: array
          description: Aliases of the template.
          deprecated: true
          items:
            type: string
        names:
          type: array
          description: Names of the template (namespace/alias format when namespaced).
          items:
            type: string
        createdAt:
          type: string
          format: date-time
          description: Time when the template was created.
        updatedAt:
          type: string
          format: date-time
          description: Time when the template was last updated.
        lastSpawnedAt:
          type: string
          format: date-time
          nullable: true
          description: Time when the template was last used.
        spawnCount:
          type: integer
          format: int64
          description: Number of times the template was used.
        buildCount:
          type: integer
          format: int32
          description: Number of times the template was built.
        envdVersion:
          type: string
          nullable: true
          description: envd version of the latest ready default build, or `null` when none.

    TemplateTagAssignment:
      type: object
      required:
        - assignmentId
        - buildId
        - assignedAt
        - buildCreatedAt
        - buildFinishedAt
      properties:
        assignmentId:
          type: string
          format: uuid
          description: Identifier of the tag assignment event.
        buildId:
          type: string
          format: uuid
          description: Identifier of the assigned build.
        assignedAt:
          type: string
          format: date-time
          description: Time when the tag was assigned to the build.
        buildCreatedAt:
          type: string
          format: date-time
          description: Time when the assigned build was created.
        buildFinishedAt:
          type: string
          format: date-time
          nullable: true
          description: Time when the assigned build finished.

    TemplateTagGroup:
      type: object
      required:
        - tag
        - assignments
        - hasMore
      properties:
        tag:
          type: string
          description: Template tag name.
        assignments:
          type: array
          description: Ready assignment events for this tag, sorted latest first.
          items:
            $ref: "#/components/schemas/TemplateTagAssignment"
        hasMore:
          type: boolean
          description: Whether more ready assignment events exist beyond the requested assignment limit.

    TemplateTagGroupsResponse:
      type: object
      required:
        - tags
        - nextCursor
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TemplateTagGroup"
        nextCursor:
          type: string
          nullable: true
          description: Cursor to pass as `tagsCursor` for the next page, or `null` if there is no next page.

    TemplateTagsCountResponse:
      type: object
      required:
        - total
      properties:
        total:
          type: integer
          format: int64
          description: Total distinct ready tags for the template.

    TemplateTagExistsResponse:
      type: object
      required:
        - exists
        - normalizedTag
      properties:
        exists:
          type: boolean
          description: Whether the template tag has at least one ready assignment.
        normalizedTag:
          type: string
          description: Normalized template tag name.

    TemplateTagAssignmentsResponse:
      type: object
      required:
        - data
        - nextCursor
      properties:
        data:
          type: array
          description: Ready assignment events for the tag, sorted latest first.
          items:
            $ref: "#/components/schemas/TemplateTagAssignment"
        nextCursor:
          type: string
          nullable: true
          description: Cursor to pass to the next list request, or `null` if there is no next page.

    TeamResolveResponse:
      type: object
      required:
        - id
        - slug
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string

    ManagementProjectUpsertRequest:
      type: object
      description: >-
        The properties of a project this side stores. Every one is synchronized
        by the caller and sent on every push, so a reconcile is a complete
        statement of the project rather than a patch.


        A project's tier is not among them. It is assigned once, at creation,
        from this side's own default, and no push moves it — limits arrive
        separately and in full through upsertProjectLimits, which takes
        precedence over the tier anyway.
      required: [name, slug, email]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          minLength: 1
          maxLength: 63
          description: >-
            Changing it renames the project, and nothing follows it. Template
            names embed the slug they were built under, so a renamed project
            keeps its existing template names and only new ones carry the new
            slug. A slug already held on this control plane is a 409, on a
            rename as much as on a create.
        email:
          type: string
          minLength: 1
          maxLength: 255
          description: Contact address recorded on the project.

    ManagementProject:
      allOf:
        - $ref: "#/components/schemas/ManagementProjectUpsertRequest"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid

    ManagementClusterRegistrationRequest:
      type: object
      required:
        - name
        - endpoint
        - endpoint_tls
        - token
      properties:
        name:
          type: string
          minLength: 1
        endpoint:
          type: string
          minLength: 1
        endpoint_tls:
          type: boolean
        token:
          type: string
          minLength: 1
        sandbox_proxy_domain:
          type: string
          nullable: true
        auth_org_id:
          type: string
          nullable: true

    ManagementProjectMemberIdentity:
      type: object
      required: [issuer, subject]
      properties:
        issuer:
          type: string
          minLength: 1
          maxLength: 2048
        subject:
          type: string
          minLength: 1
          maxLength: 2048

    ManagementProjectMemberApplyRequest:
      type: object
      required: [revision, present]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
        present:
          type: boolean
        is_default:
          type: boolean
          default: false
          description: Whether this membership is the user's default team. Omitted requests from older sources remain non-default.
        identities:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/ManagementProjectMemberIdentity"

    ManagementProjectBlockRequest:
      type: object
      description: >-
        Desired project block state. A newer revision replaces the state,
        including any intervening manual block or unblock.
      required: [revision, blocked]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Monotonic per-project revision. Older or duplicate revisions
            succeed without changing stored state.
        blocked:
          type: boolean
          description: Whether the project is refused billable work.
        reason:
          type: string
          description: >-
            Reason included in blocked-request errors. Cleared when blocked is false.

    ManagementProjectLimits:
      type: object
      description: >-
        A project's effective limits, already resolved by the caller. Every
        field is absolute: this side stores what it is given and performs no
        arithmetic of its own.


        The minimums below track the CHECK constraints on tiers, which is the
        contract for what a limit may be. project_limits stores the same values
        under looser constraints on purpose — it is a push target, and a floor
        that only rejects the impossible keeps a future decision about what is
        allowed a change to this schema rather than a migration.


        `max_disk_size_mb` and `max_free_disk_size_mb` are one ceiling under two
        names, and either name alone carries it. A caller that sends both must
        send them equal; a caller that sends neither is refused. Sending both is
        what a caller does while receivers older than the second name are still
        running.
      required:
        - revision
        - concurrent_sandboxes
        - max_sandbox_length_hours
        - max_vcpu
        - max_ram_mb
        - disk_mb
        - concurrent_template_builds
        - events_ttl_days
        - default_free_disk_size_mb
      anyOf:
        - required: [max_free_disk_size_mb]
        - required: [max_disk_size_mb]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The caller's version of this answer, raised whenever the limits it
            resolved for the project change. Delivery is over a network, so two
            pushes can be in flight at once and arrive in either order: this
            side stores the revision it accepted and drops a delivery at or
            below it, which is what keeps a delayed retry from putting the
            project back on limits it has already left.


            Comparable only against earlier revisions for the same project.
        concurrent_sandboxes:
          type: integer
          format: int32
          minimum: 1
        max_sandbox_length_hours:
          type: integer
          format: int32
          minimum: 1
        max_vcpu:
          type: integer
          format: int32
          minimum: 1
        max_ram_mb:
          type: integer
          format: int64
          minimum: 1
        disk_mb:
          type: integer
          format: int64
          minimum: 1
        concurrent_template_builds:
          type: integer
          format: int32
          minimum: 1
        events_ttl_days:
          type: integer
          format: int32
          minimum: 1
        default_free_disk_size_mb:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The default free-space growth target when a template build request
            omits one. May sit anywhere at or below the maximum free-space
            growth target, and usually sits well below it; a delivery whose
            default exceeds the maximum is rejected.
        max_free_disk_size_mb:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The most a template build may request as its free-space growth
            target.
        max_disk_size_mb:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The same ceiling as max_free_disk_size_mb, under the name it was
            first published with. Kept until every deployed sender and receiver
            speaks the other name.

tags:
  - name: builds
  - name: control-plane-management
    description: Workspace control-plane operations authenticated with service JWTs.
  - name: sandboxes
  - name: teams
  - name: templates

paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Health check successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /builds:
    get:
      summary: List team builds
      tags: [builds]
      security:
        - ApiKeyAuth: []
        - AuthProviderBearerAuth: []
          AuthProviderTeamAuth: []
      parameters:
        - $ref: "#/components/parameters/build_id_or_template"
        - $ref: "#/components/parameters/build_statuses"
        - $ref: "#/components/parameters/builds_limit"
        - $ref: "#/components/parameters/builds_cursor"
      responses:
        "200":
          description: Successfully returned paginated builds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildsListResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "500":
          $ref: "#/components/responses/500"

  /builds/statuses:
    get:
      summary: Build statuses
      tags: [builds]
      security:
        - ApiKeyAuth: []
        - AuthProviderBearerAuth: []
          AuthProviderTeamAuth: []
      parameters:
        - $ref: "#/components/parameters/build_ids"

      responses:
        "200":
          description: Successfully returned build statuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildsStatusesResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "500":
          $ref: "#/components/responses/500"

  /builds/{build_id}:
    get:
      summary: Build details
      tags: [builds]
      security:
        - ApiKeyAuth: []
        - AuthProviderBearerAuth: []
          AuthProviderTeamAuth: []
      parameters:
        - $ref: "#/components/parameters/build_id"
      responses:
        "200":
          description: Successfully returned build details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildInfo"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /sandboxes/{sandboxID}/record:
    get:
      summary: Sandbox record
      tags: [sandboxes]
      security:
        - AuthProviderBearerAuth: []
          AuthProviderTeamAuth: []
      parameters:
        - $ref: "#/components/parameters/sandboxID"
      responses:
        "200":
          description: Successfully returned sandbox details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxRecord"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /teams:
    get:
      summary: List user teams
      description: Returns all teams the authenticated user belongs to, with limits and default flag.
      tags: [teams]
      security:
        - AuthProviderBearerAuth: []
      responses:
        "200":
          description: Successfully returned user teams.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTeamsResponse"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"
    post:
      summary: Create team
      tags: [teams]
      security:
        - AuthProviderBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "200":
          description: Successfully created team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResolveResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "412":
          $ref: "#/components/responses/412"
        "500":
          $ref: "#/components/responses/500"

  /admin/users/bootstrap:
    post:
      summary: Bootstrap auth provider user
      tags: [teams]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAuthProviderUserBootstrapRequest"
      responses:
        "200":
          description: Successfully bootstrapped user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResolveResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "412":
          $ref: "#/components/responses/412"
        "500":
          $ref: "#/components/responses/500"

  /admin/teams/bootstrap:
    post:
      summary: Bootstrap team
      description: Creates and provisions a team for an admin-authenticated bootstrap workflow.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTeamBootstrapRequest"
      responses:
        "200":
          description: Successfully bootstrapped team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResolveResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "412":
          $ref: "#/components/responses/412"
        "502":
          $ref: "#/components/responses/502"
        "500":
          $ref: "#/components/responses/500"

  /admin/clusters:
    post:
      summary: Create a cluster
      description: Creates a cluster whose configuration cannot be modified.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminClusterCreateRequest"
      responses:
        "201":
          description: Cluster created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminClusterCreateResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"

  /admin/clusters/{clusterID}:
    delete:
      summary: Delete an unreferenced cluster
      description: Deletes a cluster after all team assignments are detached and no active environment references remain. Releases soft-deleted environment references in the same transaction while preserving environment and build history. Repeating a completed deletion succeeds.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/clusterID"
      responses:
        "204":
          description: Cluster deleted or already absent.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"

  /v1/management/clusters/{clusterID}/destroy-readiness:
    get:
      operationId: managementClusterDestroyReadiness
      summary: Check cluster destroy readiness
      description: Checks whether this exact cluster has active templates or snapshots. Soft-deleted history and team assignments do not block this check. Returns success if the cluster is absent. This read does not change resources or prevent later template creation.
      tags: [control-plane-management]
      security:
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/clusterID"
      responses:
        "204":
          description: No active templates or snapshots reference the cluster.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "409":
          description: Active templates or snapshots must be deleted before destroying the cluster.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/500"

  /admin/teams/{teamID}/cluster:
    get:
      summary: Get a team's assigned cluster
      description: Returns the current cluster assignment without exposing cluster credentials.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/teamID"
      responses:
        "200":
          description: Cluster assignment returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTeamClusterAssignmentResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
    put:
      summary: Assign a cluster to a team
      description: >-
        Updates the team's cluster reference to an existing cluster. New and replacement
        assignments require a tier identifier containing `enterprise`, case-insensitively.
        Replaying the identical assignment succeeds even if the team's tier later changes.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/teamID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTeamClusterAssignmentRequest"
      responses:
        "204":
          description: Cluster assigned.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "412":
          $ref: "#/components/responses/412"
        "500":
          $ref: "#/components/responses/500"

  /admin/teams/{teamID}/cluster/{clusterID}:
    delete:
      summary: Detach a cluster from a team
      description: Clears the assignment only when the team is unassigned or assigned to the specified cluster.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/teamID"
        - $ref: "#/components/parameters/clusterID"
      responses:
        "204":
          description: Cluster detached or the team was already unassigned.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "412":
          $ref: "#/components/responses/412"
        "500":
          $ref: "#/components/responses/500"

  /admin/teams/{teamID}/ban:
    put:
      summary: Ban a team
      description: Marks the team as banned so its API keys stop authenticating. Idempotent; running workloads are not touched.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/teamID"
      responses:
        "204":
          description: Team banned.
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
    delete:
      summary: Unban a team
      description: Clears the team's ban. Idempotent.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/teamID"
      responses:
        "204":
          description: Team unbanned.
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /admin/teams/{teamID}/block:
    put:
      summary: Block a team
      description: Marks the team as blocked with the given reason, so it can no longer start sandboxes or builds. Idempotent; a repeated call replaces the reason.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/teamID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTeamBlockRequest"
      responses:
        "204":
          description: Team blocked.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
    delete:
      summary: Unblock a team
      description: Clears the team's block and its recorded reason. Idempotent.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/teamID"
      responses:
        "204":
          description: Team unblocked.
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /admin/user-profiles/resolve:
    post:
      summary: Resolve user profiles
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAuthProviderProfilesResolveRequest"
      responses:
        "200":
          description: Successfully resolved profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthProviderProfilesResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"

  /admin/user-profiles/by-email:
    post:
      summary: Lookup user profiles by email
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAuthProviderProfilesLookupEmailRequest"
      responses:
        "200":
          description: Successfully found matching profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthProviderProfilesResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"

  /admin/user-profiles/{userId}:
    get:
      summary: User profile
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: Successfully found profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthProviderProfilesResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"

  /admin/users/{userId}:
    delete:
      summary: Delete user
      description: Deletes a user by removing the identity provider record, user_identities mapping, and public.users row.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "204":
          description: Successfully deleted user.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "412":
          $ref: "#/components/responses/412"
        "500":
          $ref: "#/components/responses/500"

