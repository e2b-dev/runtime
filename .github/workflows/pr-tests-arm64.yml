name: ARM64 tests on PRs

on:
  workflow_call:
    inputs:
      run-tests:
        type: boolean
        description: "Whether to run ARM64 checks and tests"
        required: false
        default: true

permissions:
  contents: read

jobs:
  cross-compile:
    name: Cross-compile all packages for ARM64
    if: ${{ inputs.run-tests == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Don't use go-setup-cache here: its key has no arch component, so this
      # job would share it with amd64 jobs and restore a multi-GB cache of
      # useless amd64 objects, then rebuild everything for arm64 on top —
      # which can fill the runner disk (and the arm64 objects never get
      # saved). Keep a dedicated arm64-keyed cache instead.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false

      # One reset of a module proxy stream fails the job otherwise; see
      # go-setup-cache for the mechanism.
      - name: Retry module proxy errors
        shell: bash
        run: echo 'GOPROXY=https://proxy.golang.org|https://proxy.golang.org:443|https://proxy.golang.org/|direct' | tee -a "$GITHUB_ENV"

      - name: Restore ARM64 Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-arm64-cross-${{ hashFiles('go.work', 'packages/*/go.mod', 'packages/*/go.sum') }}
          restore-keys: go-arm64-cross-

      - name: Install ARM64 cross-compiler
        # packages.microsoft.com (preinstalled on runner images) intermittently
        # serves invalid clearsigned InRelease files, failing apt-get update.
        # It's not needed here — gcc comes from the Ubuntu archive — so drop
        # those sources instead of letting a bad MS mirror fail the job.
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* /etc/apt/sources.list.d/azure-cli.*
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build and vet packages (pure Go)
        run: |
          for pkg in api client-proxy envd shared db; do
            echo "::group::packages/$pkg"
            pushd "packages/$pkg" > /dev/null
            GOARCH=arm64 go build ./...
            GOARCH=arm64 go vet ./...
            popd > /dev/null
            echo "::endgroup::"
          done

      - name: Build and vet orchestrator (CGO)
        run: |
          CGO_ENABLED=1 CC=aarch64-linux-gnu-gcc GOARCH=arm64 go build ./...
          CGO_ENABLED=1 CC=aarch64-linux-gnu-gcc GOARCH=arm64 go vet ./...
        working-directory: packages/orchestrator

  arm64-unit-tests:
    name: Run ARM64 test shards
    if: ${{ inputs.run-tests == true }}
    # Shards that only need Docker run on Blacksmith arm64. The orchestrator
    # shard stays on infra-runner-arm: it needs modprobe nbd.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      GIN_MODE: test
      # Parallel `go test ./...` binaries derive the same Ryuk session id
      # and race on `reaper_<hash>` creation. Disable Ryuk; t.Cleanup
      # handles normal exit, and every shard runs on a fresh VM, so
      # containers left by an abnormal exit die with it.
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # The shards that set postgres share one server: each test copies its
      # own database from a migrated template on it.
      PG_TEST_DATABASE_URL: ${{ matrix.postgres && 'postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable' || '' }}
      # The shards that set redis share one server: each test's client
      # namespaces its keys (go.segfaultmedaddy.com/redistest).
      REDIS_TEST_DATABASE_URL: ${{ matrix.redis && 'redis://localhost:6379/0' || '' }}
    # Service containers take no server flags, so the settings go in through
    # POSTGRES_INITDB_ARGS, which writes them into postgresql.conf. Durability
    # is traded for speed, and max_connections covers the parallel tests of
    # every package go test runs at once. An empty image skips the service.
    services:
      postgres:
        image: ${{ matrix.postgres && 'postgres:18-alpine' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: >-
            --no-sync
            -c max_connections=500
            -c fsync=off
            -c synchronous_commit=off
            -c full_page_writes=off
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready --host 127.0.0.1 --username postgres"
          --health-interval 2s
          --health-start-period 30s
          --health-start-interval 200ms
          --health-timeout 5s
          --health-retries 30
      redis:
        image: ${{ matrix.redis && 'redis:8-alpine' || '' }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-start-period 30s
          --health-start-interval 200ms
          --health-timeout 5s
          --health-retries 30
    strategy:
      matrix:
        include:
          - package: packages/api
            test_path: ./...
            postgres: true
            redis: true
            sudo: false
            runner: blacksmith-4vcpu-ubuntu-2404-arm
          - package: packages/client-proxy
            test_path: ./...
            redis: true
            sudo: false
            runner: blacksmith-4vcpu-ubuntu-2404-arm
          - package: packages/db
            test_path: ./...
            postgres: true
            sudo: false
            runner: blacksmith-4vcpu-ubuntu-2404-arm
          # envd mounts via bindfs (FUSE, no modprobe); this shard doubles as
          # the FUSE-on-Blacksmith canary — if it fails, pin it back to
          # infra-runner-arm.
          - package: packages/envd
            test_path: ./...
            sudo: true
            runner: blacksmith-4vcpu-ubuntu-2404-arm
          - package: packages/orchestrator
            test_path: ./...
            sudo: true
            runner: infra-runner-arm
          - package: packages/shared
            test_path: ./pkg/...
            redis: true
            sudo: false
            runner: blacksmith-4vcpu-ubuntu-2404-arm
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: ./.github/actions/go-setup-cache
        with:
          cache-dependency-paths: |
            go.work
            ${{ matrix.package }}/go.mod
            ${{ matrix.package }}/go.sum

      - name: Use the Docker Hub mirror
        uses: ./.github/actions/docker-hub-mirror

      - name: Setup envd tests
        run: |
          sudo apt-get update && sudo apt-get install -y bindfs
        if: matrix.package == 'packages/envd'

      - name: Setup orchestrator tests
        run: |
          make -C packages/orchestrator fetch-busybox BUILD_ARCH=arm64
          echo "HOST_BUSYBOX_DIR=$(pwd)/packages/orchestrator/.busybox" >> "$GITHUB_ENV"

          # Enable unprivileged uffd (Ubuntu defaults to 0)
          echo 1 | sudo tee /proc/sys/vm/unprivileged_userfaultfd

          # Enable hugepages (256 × 2MB = 512MB).
          # Tests that need more hugepages than available will skip gracefully.
          sudo mkdir -p /mnt/hugepages
          sudo mount -t hugetlbfs none /mnt/hugepages
          echo 256 | sudo tee /proc/sys/vm/nr_hugepages

          # Install extra kernel modules (nbd is not in base modules on GitHub-hosted runners)
          sudo apt-get update
          sudo apt-get install -y linux-modules-extra-$(uname -r)
          sudo modprobe nbd nbds_max=256

          # Disable inotify watching of change events for NBD devices
          echo 'ACTION=="add|change", KERNEL=="nbd*", OPTIONS:="nowatch"' | sudo tee /etc/udev/rules.d/97-nbd-device.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger
        if: matrix.package == 'packages/orchestrator'

      # Prefixed so the pins cannot shadow variables such as GO in the
      # Makefiles the tests run.
      - name: Parse .tool-versions
        uses: wistia/parse-tool-versions@32f568a4ffd4bfa7720ebf93f171597d1ebc979a # v2.1.1
        with:
          prefix: TOOL_VERSION_

      # mise downloads the release binary pinned in .tool-versions rather than
      # building it from source.
      - name: Install gotestsum
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: ${{ env.TOOL_VERSION_MISE }}
          install_args: gotestsum

      # Put the binary itself on PATH, not just mise's shim: under sudo the shim
      # would look for mise's installs in root's home.
      - name: Add gotestsum to PATH
        run: dirname "$(mise which gotestsum)" >> "$GITHUB_PATH"

      - name: Compile test binaries
        working-directory: ${{ matrix.package }}
        run: sudo -E `which go` test -run '^$' ${{ matrix.test_path }}
        if: matrix.sudo == true

      # sudo strips PATH; pass it through so gotestsum/go resolve to the runner's
      # toolchain (1.27.3) instead of /usr/bin/go.
      - name: Run tests that require sudo
        working-directory: ${{ matrix.package }}
        run: |
          sudo -E env "PATH=$PATH" gotestsum --format=standard-verbose \
            -- -timeout 20m ${{ matrix.test_path }}
        if: matrix.sudo == true

      - name: Compile test binaries
        working-directory: ${{ matrix.package }}
        run: go test -run '^$' ${{ matrix.test_path }}
        if: matrix.sudo == false

      - name: Run tests
        working-directory: ${{ matrix.package }}
        run: |
          gotestsum --format=standard-verbose \
            -- -timeout 20m ${{ matrix.test_path }}
        if: matrix.sudo == false

  arm64_tests:
    needs:
      - cross-compile
      - arm64-unit-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate ARM64 test result
        run: |
          if [[ "${{ inputs.run-tests }}" != "true" ]]; then
            echo "ARM64 tests skipped because test inputs did not change"
            exit 0
          fi

          if [[ "${{ needs.cross-compile.result }}" != "success" ]]; then
            echo "cross-compile result: ${{ needs.cross-compile.result }}"
            exit 1
          fi

          if [[ "${{ needs.arm64-unit-tests.result }}" != "success" ]]; then
            echo "ARM64 unit tests result: ${{ needs.arm64-unit-tests.result }}"
            exit 1
          fi

          echo "all ARM64 checks succeeded"
