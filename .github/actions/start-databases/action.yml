name: "Start Databases"
description: "Kicks off the PostgreSQL, ClickHouse, and Redis containers in the background. Run this as early as possible: pulls and boots then overlap with the Go builds, and the start-services action later waits for health before migrating."

runs:
  using: "composite"
  steps:
    - name: Start Database Containers
      env:
        CLICKHOUSE_USERNAME: "e2b"
        CLICKHOUSE_PASSWORD: "clickity-clicky-click"
        CLICKHOUSE_PORT: "9000"
        CLICKHOUSE_DATABASE: "default"
      # Every start runs in the background, detached from this step's
      # output, so the image pulls (with rate-limit retries, see
      # scripts/pull-retry.sh) and container boots overlap with the
      # (minutes-long) package builds that follow. Each start logs under
      # $RUNNER_TEMP/start-databases and records its exit status there;
      # start-services waits on container health and fails as soon as a
      # start has failed, printing that log.
      run: ./.github/actions/start-databases/start.sh
      shell: bash
