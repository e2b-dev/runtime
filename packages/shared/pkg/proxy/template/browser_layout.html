<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="robots" content="noindex">
    <title>{{template "title" .}} · E2B</title>
    <style>
        :root {
            --bg: #fafafa;
            --bg-1: #f5f5f5;
            --bg-inverted: #0a0a0a;
            --bg-inverted-hover: #292929;
            --fill: #ebebeb;
            --stroke: #d6d6d6;
            --stroke-active: #c2c2c2;
            --fg: #0a0a0a;
            --fg-secondary: #333333;
            --fg-tertiary: #707070;
            --fg-inverted: #ffffff;
            --accent-main: #e56f00;
            --accent-error: #ff4400;
            --accent-error-bg: rgba(255, 68, 0, 0.16);
            --accent-warning: #d1a102;
            --accent-warning-bg: rgba(209, 161, 2, 0.14);
            --accent-info: #3c98c7;
            --accent-info-bg: rgba(61, 153, 199, 0.2);
            --hatch: rgba(214, 214, 214, 0.5);
            --shadow: 0 4px 6px hsl(0 0% 90% / 0.3), 0 2px 4px hsl(0 0% 90% / 0.3);
            --font-sans: "IBM Plex Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0a0a0a;
                --bg-1: #141414;
                --bg-inverted: #ffffff;
                --bg-inverted-hover: #ebebeb;
                --fill: #292929;
                --stroke: #292929;
                --stroke-active: #424242;
                --fg: #ffffff;
                --fg-secondary: #e0e0e0;
                --fg-tertiary: #848484;
                --fg-inverted: #0a0a0a;
                --accent-main: #ff8800;
                --accent-error: #f54545;
                --accent-error-bg: rgba(245, 69, 69, 0.16);
                --accent-warning: #ffff00;
                --accent-warning-bg: rgba(255, 255, 0, 0.16);
                --accent-info: #59a8e1;
                --accent-info-bg: rgba(89, 168, 225, 0.22);
                --hatch: rgba(41, 41, 41, 0.9);
                --shadow: 0 4px 6px hsl(0 0% 3% / 0.2), 0 2px 4px hsl(0 0% 3% / 0.2);
            }
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font-sans);
            font-size: 0.875rem;
            line-height: 1.25rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        main {
            width: 100%;
            max-width: 28rem;
        }

        .frame {
            position: relative;
            padding-bottom: 6px;
        }

        .frame::before {
            content: "";
            position: absolute;
            inset: 4px 3px 0;
            border: 1px solid var(--stroke);
            background: repeating-linear-gradient(135deg, var(--hatch) 0 1px, transparent 1px 3.5px);
        }

        .card {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            padding: 1.5rem;
            background: var(--bg);
            border: 1px solid var(--stroke);
            box-shadow: var(--shadow);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .logo {
            display: block;
            height: 18px;
            width: auto;
            color: var(--fg);
        }

        .logo-dark {
            display: none;
        }

        @media (prefers-color-scheme: dark) {
            .logo-light {
                display: none;
            }

            .logo-dark {
                display: inline;
            }
        }

        .badge {
            display: inline-flex;
            align-items: center;
            height: 1.125rem;
            padding: 0 5px;
            font-size: 0.75rem;
            line-height: 1.0625rem;
            text-transform: uppercase;
            white-space: nowrap;
            background: var(--fill);
            color: var(--fg-secondary);
        }

        .badge-error {
            background: var(--accent-error-bg);
            color: var(--accent-error);
        }

        .badge-warning {
            background: var(--accent-warning-bg);
            color: var(--accent-warning);
        }

        .badge-info {
            background: var(--accent-info-bg);
            color: var(--accent-info);
        }

        .card-body {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        h1 {
            font-size: 1rem;
            line-height: 1.25rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .message {
            color: var(--fg-secondary);
            overflow-wrap: anywhere;
        }

        .message::first-letter {
            text-transform: uppercase;
        }

        .hint {
            margin-top: 0.75rem;
            color: var(--fg-tertiary);
        }

        code {
            font-family: var(--font-mono);
            font-size: 0.8125rem;
            color: var(--fg);
            overflow-wrap: anywhere;
        }

        .output {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            background: var(--bg-1);
            border: 1px solid var(--stroke);
            font-family: var(--font-mono);
            font-size: 0.8125rem;
            color: var(--fg-secondary);
            overflow-wrap: anywhere;
        }

        .output .muted {
            color: var(--fg-tertiary);
        }

        .output .error {
            color: var(--accent-error);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
        }

        .button {
            flex: 1 1 10rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            height: 2.25rem;
            padding: 0 1rem;
            border: 1px solid var(--stroke);
            color: var(--fg);
            font-weight: 500;
            text-decoration: none;
            white-space: nowrap;
            transition: border-color 150ms, background-color 150ms;
        }

        .button:has(svg) {
            padding: 0 0.75rem 0 0.625rem;
        }

        .button:has(.icon-trailing) {
            padding: 0 0.625rem 0 0.75rem;
        }

        .button:hover {
            border-color: var(--stroke-active);
        }

        .button:active {
            background: var(--bg-1);
        }

        .button-primary {
            border-color: var(--bg-inverted);
            background: var(--bg-inverted);
            color: var(--fg-inverted);
        }

        .button-primary:hover {
            border-color: var(--bg-inverted-hover);
            background: var(--bg-inverted-hover);
        }

        .button-primary:active {
            background: var(--bg-inverted-hover);
        }

        .button svg {
            width: 1rem;
            height: 1rem;
            flex-shrink: 0;
            color: var(--fg-tertiary);
        }

        .button-primary svg {
            color: var(--fg-inverted);
        }

        a:focus-visible {
            outline: 1px solid var(--accent-main);
            outline-offset: 2px;
        }

        @media (max-width: 480px) {
            body {
                align-items: flex-start;
            }

            .card {
                padding: 1.25rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .button {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="frame">
            <section class="card" aria-labelledby="title">
                <div class="card-header">
                    <svg class="logo" viewBox="7.75 7.7 51.5 14.6" fill="none" role="img" aria-label="E2B" xmlns="http://www.w3.org/2000/svg">

                        </g>
                    </svg>
                    <span class="badge badge-{{template "tone" .}}">{{.Code}} {{statusText .Code}}</span>
                </div>
                <div class="card-body">
                    <h1 id="title">{{template "title" .}}</h1>
                    {{template "body" .}}
                </div>
                {{- block "actions" .}}{{end}}
            </section>
        </div>
    </main>
</body>
</html>
