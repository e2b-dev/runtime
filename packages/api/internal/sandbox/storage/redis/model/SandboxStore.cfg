\* TLC configuration for SandboxStore.tla. check.sh runs it; NAME=VALUE arguments
\* to check.sh override the constants below, and INVARIANTS replaces the list.
SPECIFICATION Spec

CONSTANTS
  Sandboxes = {s1, s2}
  P2Release = "R3"
  MaxExec = 2
  MaxTx = 2
  TransitionTTL = 1
  MaxCrashes = 1
  MaxFailedReplies = 1
  MaxCleanupLostReplies = 1
  MaxTicks = 1
  MaxFlips = 1
  MaxReplicationLosses = 0
  RemoveDeletesBeforeSrem = FALSE
  UpdateProbesOtherForm = FALSE
  AddLocksNewFormOnly = FALSE
  UnguardedSREM = FALSE
  UnguardedRemoveScripts = FALSE
  UnguardedCleanup = FALSE
  CleanupSkipsSrem = FALSE
  CleanupDeleteFirst = FALSE
  RemoveSkipsRecheck = FALSE

SYMMETRY SandboxPerms

INVARIANTS
  TypeOK
  OneRecordPerSandbox
  IndexHasRecord
  RecordIndexedOrTransient
  LockExclusion
  NoSuccessorDeleted
  NoLiveMembershipRemoved
  NoDeadReAdd
  NoSuccessorReportedGone
