syntax = "proto3";

package upgrade;

import "process/process.proto";
import "filesystem/filesystem.proto";

// HandoverState is the entire cross-version compatibility contract for an envd
// live-upgrade (design §5.2, §6.4): the outgoing envd serializes it to a tmpfs
// file, the incoming (new-binary) envd decodes it after execve to reconstruct
// its world. It is an additive protobuf — an older envd omits fields a newer one
// added, and the reader treats absent fields as defaults.
//
// Schema is the versioning discipline §6.4 requires: it is bumped on any change,
// and a reader MUST refuse a blob whose schema exceeds the maximum it understands
// (decode every schema <= N, abort on schema > N) rather than mis-read a
// newer-than-known layout — the outgoing envd keeps running the old binary.
message HandoverState {
  uint32 schema = 1;
  string from_ver = 2;
  repeated HandoverProc processes = 3;
  // terminated carries the retention cache (recently-exited terminal events not
  // yet drained).
  repeated HandoverExit terminated = 4;
  // watchers is the filesystem service's active-watcher set. The filesystem
  // service owns building/consuming these; the process handover only carries
  // them.
  repeated HandoverWatcher watchers = 5;
  // mounts is the API service's NFS mount ledger (path -> lifecycle), carried so
  // the new envd's post-upgrade /init skips re-mounting a still-live mount.
  repeated MountEntry mounts = 6;
  // forwards is the port forwarder's active socat set, carried so the new envd
  // re-adopts the running socat children instead of spawning duplicates.
  repeated ForwardedPort forwards = 7;
  // guest_frozen_cgroups are cgroup paths, relative to the cgroup root, that the
  // GUEST had frozen before our pre-pause sweep ran. The resume thaw must leave
  // these alone: clearing them would restart processes the guest deliberately
  // suspended (docker pause writes cgroup.freeze). Carried because the thaw runs
  // after a live upgrade may have replaced the process image that recorded them.
  //
  // Absent or empty means "no record", and the thaw then clears everything it
  // finds frozen -- the behaviour that predates this field. That degradation is
  // deliberate: a lost record must never leave a guest frozen.
  repeated string guest_frozen_cgroups = 8;
  // defaults is the exec context the outgoing envd was serving with -- the default
  // user and workdir every request that omits them resolves against. Carried so the
  // incoming image reconstructs them from the blob instead of depending on the
  // orchestrator's post-upgrade /init to re-send them.
  //
  // Absent means "no record", and the incoming envd then keeps its compiled-in
  // fallback -- the behaviour that predates this field. A subsequent /init carrying a
  // non-empty user still wins: the host owns this state, the blob is a backstop.
  HandoverDefaults defaults = 9;
  // helper_pids are children the outgoing envd forked for its own work and that
  // need nothing but reaping, such as a CPU hotplug write still in the kernel.
  // They survive the execve as children of the new envd, which wait4s each. A
  // reader that predates this field leaves at most a few zombies, so the field
  // does not raise the schema.
  repeated int32 helper_pids = 10;
}

// HandoverDefaults is the outgoing envd's execcontext.Defaults, minus the env vars
// (which /init replaces wholesale anyway).
message HandoverDefaults {
  string user = 1;
  string workdir = 2;    // empty when unset
  bool has_workdir = 3;  // distinguishes an empty workdir from no workdir
}

// MountEntry is one NFS volume mount the outgoing envd had set up, keyed by the
// lifecycle it was mounted for. The kernel mount survives execve; carrying the
// ledger lets the new envd recognize a matching-lifecycle mount and leave it
// in place rather than force-unmounting and remounting it (ESTALE risk).
message MountEntry {
  string path = 1;
  string lifecycle_id = 2;
}

// ForwardedPort is one active port-forward. The socat child survives execve;
// carrying its pid lets the new forwarder re-adopt it (suppressing a duplicate
// socat and reaping it when the port closes) instead of respawning.
message ForwardedPort {
  string key = 1;           // the forwarder map key: "<listener_pid>-<port>"
  uint32 port = 2;
  int32 listener_pid = 3;   // pid of the guest process listening on the port
  uint32 family = 4;        // IP version (4 or 6)
  int32 socat_pid = 5;      // pid of the running socat child to re-adopt
}

// HandoverProc is a live child re-adopted across the same-PID execve. The fd
// fields carry the *numbers* (kept valid across execve, CLOEXEC cleared); the
// kernel objects ride the fd table.
message HandoverProc {
  uint32 pid = 1;                 // K-anchor: live child, survives same-PID execve
  string tag = 2;                 // K-metadata: not in /proc, unreconstructable if lost
  bool has_tag = 3;               // distinguishes an empty tag from no tag
  string cg_type = 4;             // user | pty
  process.ProcessConfig config = 5;
  int32 stdout_fd = 6;
  int32 stderr_fd = 7;
  int32 stdin_fd = 8;
  int32 tty_fd = 9;
  int64 timeout_ms = 10;          // per-process kill deadline remaining, re-armed on readopt
}

// HandoverExit is a recently-terminated process whose terminal event has not yet
// been drained by a client — carried so an exit code is not lost across the swap.
message HandoverExit {
  uint32 pid = 1;
  string tag = 2;
  bool has_tag = 3;
  process.ProcessEvent.EndEvent end = 4;
  int64 remaining_ms = 5;         // retention TTL remaining
}

// HandoverWatcher re-arms a persistent CreateWatcher on the incoming envd under
// the preserved id (design §6.9, Option C: re-arm from metadata, do NOT carry an
// inotify fd).
message HandoverWatcher {
  string id = 1;
  string path = 2;
  bool recursive = 3;
  bool include_entry_info = 4;
  repeated filesystem.FilesystemEvent pending_events = 5;  // un-polled GetWatcherEvents buffer
}
