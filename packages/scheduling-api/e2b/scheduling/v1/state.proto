edition = "2024";

package e2b.scheduling.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/e2b-dev/infra/packages/shared/pkg/grpc/scheduling;scheduling";

// Records of running sandboxes. A record is the JSON of the store's sandbox
// record, as the store keeps it.
service StateService {
  // A record of the same execution already stored is kept.
  rpc Add(AddRequest) returns (AddResponse);

  rpc Get(GetRequest) returns (GetResponse);

  rpc Remove(RemoveRequest) returns (RemoveResponse);

  rpc TeamItems(TeamItemsRequest) returns (stream TeamItemsResponse);

  // Not a pure read: it sweeps and re-scores entries of the expiration index.
  rpc ExpiredItems(ExpiredItemsRequest) returns (stream ExpiredItemsResponse);

  // Not a pure read: it prunes stale entries of the teams index.
  rpc TeamsWithSandboxCount(TeamsWithSandboxCountRequest) returns (TeamsWithSandboxCountResponse);

  // A failed read answers no orphans.
  rpc Reconcile(ReconcileRequest) returns (ReconcileResponse);

  // OK leaves the record's lock held until CommitUpdate or AbortUpdate with
  // the token, or until it expires.
  rpc BeginUpdate(BeginUpdateRequest) returns (BeginUpdateResponse);

  // Writes only while the lock still holds the token, and releases it.
  rpc CommitUpdate(CommitUpdateRequest) returns (CommitUpdateResponse);

  rpc AbortUpdate(AbortUpdateRequest) returns (AbortUpdateResponse);

  rpc HoldExecution(HoldExecutionRequest) returns (HoldExecutionResponse);

  // Moves the execution to node_id and releases the hold in one write. OK with
  // moved false: a repeat that found that write done and wrote nothing.
  rpc MoveHeldExecution(MoveHeldExecutionRequest) returns (MoveHeldExecutionResponse);

  rpc ReleaseHeldExecution(ReleaseHeldExecutionRequest) returns (ReleaseHeldExecutionResponse);

  // Returns the record as it was before the removal.
  rpc RemoveHeldExecution(RemoveHeldExecutionRequest) returns (RemoveHeldExecutionResponse);

  // OK with transition.id set: this call started the transition, and the
  // caller must end it with FinishTransition. OK with transition.in_flight_id
  // set: another transition is open and none was started; wait it out with
  // WaitForTransition and that ID. Most refusals also carry the transition
  // with the record as read. current_state is set with INVALID_TRANSITION.
  rpc BeginRemoving(BeginRemovingRequest) returns (BeginRemovingResponse);

  // Any failure, a failed restore of a transient action to running included,
  // is a failed call: the waiters read it as the transition's failure.
  rpc FinishTransition(FinishTransitionRequest) returns (FinishTransitionResponse);

  // current_state is set with INVALID_TRANSITION.
  rpc RestoreRunning(RestoreRunningRequest) returns (RestoreRunningResponse);

  // current_state is set with INVALID_TRANSITION.
  rpc RestoreCheckpointed(RestoreCheckpointedRequest) returns (RestoreCheckpointedResponse);

  // Long poll: answers WAITING after the server's maximum wait; call again
  // with the returned transition_id, which an empty request ID resolves to.
  // A transition whose result expired, or an unknown ID, answers FINISHED.
  rpc WaitForTransition(WaitForTransitionRequest) returns (WaitForTransitionResponse);
}

enum StateOutcome {
  STATE_OUTCOME_UNSPECIFIED = 0;
  STATE_OUTCOME_OK = 1;
  STATE_OUTCOME_NOT_FOUND = 2;
  STATE_OUTCOME_LIFECYCLE_HELD = 3;
  STATE_OUTCOME_EXECUTION_MISMATCH = 4;
  STATE_OUTCOME_LOCK_LOST = 5;
  STATE_OUTCOME_HOLD_CONFLICT = 6;
  STATE_OUTCOME_NOT_HELD = 7;
  STATE_OUTCOME_EVICTION_IN_PROGRESS = 8;
  STATE_OUTCOME_EVICTION_NOT_NEEDED = 9;
  STATE_OUTCOME_INVALID_TRANSITION = 10;
  STATE_OUTCOME_RESTORE_CONFLICT = 11;
}

enum SandboxState {
  SANDBOX_STATE_UNSPECIFIED = 0;
  SANDBOX_STATE_RUNNING = 1;
  SANDBOX_STATE_PAUSING = 2;
  SANDBOX_STATE_KILLING = 3;
  SANDBOX_STATE_SNAPSHOTTING = 4;
}

message AddRequest {
  bytes record = 1;
}

message AddResponse {
  StateOutcome outcome = 1;
}

message GetRequest {
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  string sandbox_id = 2 [(buf.validate.field).string.pattern = "^[^{}]+$"];
}

message GetResponse {
  StateOutcome outcome = 1;
  bytes record = 2;
}

message RemoveRequest {
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  string sandbox_id = 2 [(buf.validate.field).string.pattern = "^[^{}]+$"];
  // Empty removes the record of any execution.
  string expected_execution_id = 3;
}

message RemoveResponse {
  StateOutcome outcome = 1;
}

message TeamItemsRequest {
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  // Empty means every state.
  repeated SandboxState states = 2 [(buf.validate.field).repeated.items.enum = {
    defined_only: true
    not_in: [0]
  }];
}

message TeamItemsResponse {
  repeated bytes records = 1;
}

message ExpiredItemsRequest {}

message ExpiredItemsResponse {
  repeated bytes records = 1;
}

message TeamsWithSandboxCountRequest {}

message TeamsWithSandboxCountResponse {
  map<string, int64> counts = 1;
}

message NodeSandbox {
  string sandbox_id = 1;
  string execution_id = 2;
  string team_id = 3 [(buf.validate.field).string.uuid = true];
  string node_id = 4;
  string cluster_id = 5 [(buf.validate.field).string.uuid = true];
  google.protobuf.Timestamp start_time = 6;
  int64 vcpu = 7;
  int64 ram_mb = 8;
  bool huge_pages = 9;
  bool ended = 10;
  string guest_event = 11;
  bool disk_kept = 12;
}

message ReconcileRequest {
  string node_id = 1;
  repeated NodeSandbox sandboxes = 2;
}

message SandboxReference {
  string team_id = 1;
  string sandbox_id = 2;
}

message ReconcileResponse {
  repeated SandboxReference orphans = 1;
}

message BeginUpdateRequest {
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  string sandbox_id = 2 [(buf.validate.field).string.pattern = "^[^{}]+$"];
}

message BeginUpdateResponse {
  StateOutcome outcome = 1;
  bytes record = 2;
  // A secret of this update, valid only with its team_id and sandbox_id: it
  // writes under and releases the lock.
  bytes token = 3;
}

message CommitUpdateRequest {
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  string sandbox_id = 2 [(buf.validate.field).string.pattern = "^[^{}]+$"];
  bytes token = 3 [(buf.validate.field).bytes.min_len = 1];
  // Its team and sandbox IDs must be team_id and sandbox_id.
  bytes record = 4;
}

message CommitUpdateResponse {
  StateOutcome outcome = 1;
  bytes record = 2;
}

message AbortUpdateRequest {
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  string sandbox_id = 2 [(buf.validate.field).string.pattern = "^[^{}]+$"];
  bytes token = 3 [(buf.validate.field).bytes.min_len = 1];
}

message AbortUpdateResponse {
  StateOutcome outcome = 1;
}

message Hold {
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  string sandbox_id = 2 [(buf.validate.field).string.pattern = "^[^{}]+$"];
  string execution_id = 3;
  string source_node_id = 4;
  string id = 5 [(buf.validate.field).string.min_len = 1];
}

message HoldExecutionRequest {
  option (buf.validate.message).cel = {
    id: "hold.source_node_id"
    message: "hold.source_node_id must not be empty"
    expression: "this.hold.source_node_id != ''"
  };

  Hold hold = 1 [(buf.validate.field).required = true];
  google.protobuf.Timestamp until = 2 [(buf.validate.field).required = true];
}

message HoldExecutionResponse {
  StateOutcome outcome = 1;
}

message MoveHeldExecutionRequest {
  Hold hold = 1 [(buf.validate.field).required = true];
  string node_id = 2 [(buf.validate.field).string.min_len = 1];
}

message MoveHeldExecutionResponse {
  StateOutcome outcome = 1;
  bool moved = 2;
}

message ReleaseHeldExecutionRequest {
  Hold hold = 1 [(buf.validate.field).required = true];
}

message ReleaseHeldExecutionResponse {
  StateOutcome outcome = 1;
}

message RemoveHeldExecutionRequest {
  Hold hold = 1 [(buf.validate.field).required = true];
}

message RemoveHeldExecutionResponse {
  StateOutcome outcome = 1;
  bytes record = 2;
}

enum RemoveAction {
  REMOVE_ACTION_UNSPECIFIED = 0;
  REMOVE_ACTION_PAUSE = 1;
  REMOVE_ACTION_KILL = 2;
  REMOVE_ACTION_SNAPSHOT = 3;
}

message RemoveOptions {
  RemoveAction action = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  bool eviction = 2;
  string reason = 3;
  bool filesystem_only = 4;
  bool require_envd_healthy = 5;
  // Empty removes whatever execution is stored.
  string expect_execution_id = 6;
  bool before_end_time = 7;
}

message StateTransition {
  bytes record = 1;
  // Absent unless this transition was started by the call that returned it.
  google.protobuf.Timestamp original_end_time = 2;
  string id = 3;
  string in_flight_id = 4;
}

message BeginRemovingRequest {
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  string sandbox_id = 2 [(buf.validate.field).string.pattern = "^[^{}]+$"];
  RemoveOptions options = 3 [(buf.validate.field).required = true];
}

message BeginRemovingResponse {
  StateOutcome outcome = 1;
  StateTransition transition = 2;
  bool already_done = 3;
  SandboxState current_state = 4;
}

message TransitionResult {
  bool failed = 1;
  string error = 2;
  bool skip_restore = 3;
  bool restored = 4;
  string refusal_class = 5;
}

message FinishTransitionRequest {
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  string sandbox_id = 2 [(buf.validate.field).string.pattern = "^[^{}]+$"];
  string transition_id = 3 [(buf.validate.field).string.min_len = 1];
  RemoveAction action = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  TransitionResult result = 5;
}

message FinishTransitionResponse {
  StateOutcome outcome = 1;
}

message RestoreOptions {
  google.protobuf.Duration retry_after = 1;
  bool hold_only = 2;
  bool envd_refusal = 3;
}

message RestoreRunningRequest {
  StateTransition transition = 1 [(buf.validate.field).required = true];
  RestoreOptions options = 2;
}

message RestoreRunningResponse {
  StateOutcome outcome = 1;
  bytes record = 2;
  SandboxState current_state = 3;
}

message NetworkPlacement {
  string execution_id = 1;
  string network_mode = 2;
  string router_id = 3;
  string ingress_address = 4;
  uint32 ingress_port = 5;
}

message RestoreCheckpointedRequest {
  StateTransition transition = 1 [(buf.validate.field).required = true];
  // Absent means the worker's own network.
  NetworkPlacement placement = 2;
}

message RestoreCheckpointedResponse {
  StateOutcome outcome = 1;
  bytes record = 2;
  SandboxState current_state = 3;
}

message WaitForTransitionRequest {
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  string sandbox_id = 2 [(buf.validate.field).string.pattern = "^[^{}]+$"];
  // Empty waits for the sandbox's open transition, if any.
  string transition_id = 3;
}

enum WaitForTransitionOutcome {
  WAIT_FOR_TRANSITION_OUTCOME_UNSPECIFIED = 0;
  // The transition succeeded, or none was open.
  WAIT_FOR_TRANSITION_OUTCOME_FINISHED = 1;
  WAIT_FOR_TRANSITION_OUTCOME_WAITING = 2;
  // The node refused and the sandbox runs again. An empty refusal_class is
  // the busy-node refusal.
  WAIT_FOR_TRANSITION_OUTCOME_RESTORED = 3;
  WAIT_FOR_TRANSITION_OUTCOME_FAILED = 4;
  // The record is another team's.
  WAIT_FOR_TRANSITION_OUTCOME_NOT_FOUND = 5;
}

message WaitForTransitionResponse {
  WaitForTransitionOutcome outcome = 1;
  string transition_id = 2;
  string refusal_class = 3;
  string failure = 4;
}
